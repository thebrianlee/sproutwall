# Dependabot version updates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major versions change APIs and config (for example Tailwind, TypeScript,
      # ESLint), and a newer @types/node would describe Node APIs that the
      # Node 22 runtime does not have. Do major upgrades by hand, one per pull
      # request, and move @types/node together with the Node version.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The image stays on Node 22 to match CI (.github/workflows/ci.yml) and
      # package.json engines. Move all three together, by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
